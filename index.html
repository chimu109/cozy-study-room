#d7e9d9 50%,#f5efce 50%);border-radius:15px;box-shadow:inset 0 0 0 2px #fff7e5}.window:before{content:'';position:absolute;left:40px;top:0;width:6px;height:70px;background:#efd7b7}.shelf{position:absolute;left:20px;top:48px;color:#bfa58e;font-size:34px}.tableTop{height:23px;background:#cfae91;position:absolute;bottom:49px;left:10%;right:10%;border-radius:13px;box-shadow:0 13px 0 #b48e70}.tableTop:after{content:'';position:absolute;top:34px;left:11%;width:16px;height:50px;background:#b48e70;box-shadow:410px 0 #b48e70}.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-top:4px}.hero img{width:165px;height:153px;object-fit:cover;object-position:center;border-radius:23px;mix-blend-mode:multiply}.hero .speech{padding:10px 16px;max-width:270px;background:#fffaf4;border:1px solid #e5d5c7;border-radius:18px;text-align:center;font-size:13px;box-shadow:0 3px 0 #e4d7cb}.center{text-align:center}.timer{font-size:clamp(56px,8vw,85px);font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:1px;line-height:1.15;margin:18px 0 8px}.modeRow,.durations,.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.chip{border:1px solid #e6dcd1;background:#fff;border-radius:999px;color:#76675e;padding:9px 16px;min-height:42px}.chip.active{background:#e7eee1;color:#46654f;border-color:#bad0b9;font-weight:700}.primary{border:0;background:#709f7b;color:white;min-width:172px;border-radius:999px;padding:14px 22px;font-weight:700;min-height:48px;box-shadow:0 5px 0 #5c8866}.secondary{background:#fff;border:1px solid var(--border);border-radius:999px;padding:13px 18px;color:#705b4e;min-height:48px}.actions{margin:17px 0 4px}.progress{height:9px;border-radius:999px;background:#e9e2d6;overflow:hidden;margin:16px 0 5px}.progress>div{height:100%;width:0;background:#91b79d;transition:width .3s}.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.char{border:1px solid #e9dfd2;border-radius:16px;background:#fffaf4;padding:7px 5px 10px;min-width:0}.char.selected{outline:3px solid #9abda3;background:#f0f8ea}.char img{width:100%;aspect-ratio:1.18;object-fit:cover;display:block;border-radius:11px}.char strong{display:block;margin-top:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.char small{display:block;font-size:10px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f5f2e9;border-radius:15px;padding:14px 5px;text-align:center}.stat strong{font-size:24px;display:block}.stat span{color:var(--muted);font-size:11px}.addTask{display:flex;gap:8px;margin-bottom:12px}.addTask input{flex:1;min-width:0;padding:12px;border:1px solid #e4d8ce;border-radius:13px;background:white;font-size:16px}.addTask button{border:0;background:#e7cfc1;border-radius:12px;padding:0 16px}.task{display:flex;align-items:center;gap:10px;padding:11px 3px;border-bottom:1px dashed #e8ded2}.task input{width:20px;height:20px;accent-color:#83ac8d}.task span{flex:1;min-width:0;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:#a99e93}.task button{border:0;background:transparent;color:#b8a59c;font-size:19px}.empty{color:#a49788;text-align:center;padding:24px 8px;font-size:13px}.history{max-height:290px;overflow:auto}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 1px;border-bottom:1px solid #eee5db;font-size:13px}.record small{color:var(--muted)}.bottomTools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.bottomTools button{border:1px solid #e7ded4;background:white;padding:9px 13px;border-radius:12px;color:#786d62}.toast{font-size:12px;color:#7d8d70;text-align:center;min-height:20px;margin-top:8px}.note{font-size:11px;line-height:1.7;color:#9a8b80;margin-top:11px}@media(max-width:780px){.layout{grid-template-columns:1fr}.panel{padding:18px}.studyRoom{min-height:255px}.chars{grid-template-columns:repeat(4,1fr)}header{padding-top:17px}}@media(max-width:390px){.chars{grid-template-columns:repeat(4,1fr);gap:6px}.char{padding:4px 3px 7px}.char strong{font-size:11px}.brand h1{font-size:19px}.brand p{font-size:9px}.smallpill{font-size:11px}}@media(prefers-reduced-motion:reduce){.progress>div{transition:none}}

</style></head><body><header><div class="brand"><div class="brandMark">☕</div><div><h1>轻松自习室</h1><p>COZY STUDY ROOM · V2</p></div></div><div class="smallpill" id="todayLabel">今天也要慢慢来 ♡</div></header><main><div class="layout"><div><section class="panel"><div class="sectionHead"><h2>✿ 一起安静学习吧</h2><span class="subtle" id="sessionStatus">准备就绪</span></div><div class="studyRoom"><span class="shelf">📚<br>🪴</span><span class="window"></span><div class="tableTop"></div><div class="hero"><img id="heroImage" src="assets/bear.webp" alt="今日陪伴的小动物"><div class="speech" id="speech" aria-live="polite">今天也一起加油吧～</div></div></div><div class="center"><div class="timer" id="timer" aria-live="off">25:00</div><div class="modeRow"><button type="button" class="chip active" id="countdownBtn">倒计时</button><button type="button" class="chip" id="freeBtn">自由计时</button></div><div class="durations" id="durations" style="margin-top:12px"><button class="chip" data-min="10">10 分钟</button><button class="chip" data-min="15">15 分钟</button><button class="chip active" data-min="25">25 分钟</button><button class="chip" data-min="45">45 分钟</button><button class="chip" data-min="60">60 分钟</button></div><div class="progress"><div id="bar"></div></div><div class="actions"><button type="button" class="primary" id="startBtn">开始专注</button><button type="button" class="secondary" id="finishBtn" hidden>提前结束</button><button type="button" class="secondary" id="resetBtn" hidden>放弃</button></div><p class="toast" id="message" role="status"></p></div></section><section class="panel"><div class="sectionHead"><h2>♡ 选择今日陪伴伙伴</h2><span class="subtle">8 位可选</span></div><div class="chars" id="characterGrid"></div><p class="note">角色插图裁取自你提供的参考图片，仅供个人自习陪伴使用。请勿将图片素材作为商业资源分发。</p></section></div><div><section class="panel"><div class="sectionHead"><h2>✦ 今天的学习足迹</h2><span class="subtle" id="todayDate"></span></div><div class="stats"><div class="stat"><strong id="todayMinutes">0</strong><span>今日分钟</span></div><div class="stat"><strong id="totalMinutes">0</strong><span>累计分钟</span></div><div class="stat"><strong id="sessionCount">0</strong><span>完成次数</span></div></div></section><section class="panel"><div class="sectionHead"><h2>✎ 今日任务</h2><span class="subtle" id="taskProgress">0 / 0</span></div><form id="taskForm" class="addTask"><input id="taskInput" maxlength="100" placeholder="例如：阅读一篇英文文献" aria-label="新任务" required><button type="submit">添加</button></form><div id="taskList"></div></section><section class="panel"><div class="sectionHead"><h2>☼ 专注日记</h2><span class="subtle">最近20次</span></div><div class="history" id="history"></div><div class="bottomTools"><button id="exportBtn" type="button">导出备份</button><button id="importBtn" type="button">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="note">电脑、平板、手机可使用同一网址，但记录仅保存在各设备本地，不会自动同步。更换设备时请先导出 JSON 备份，再在另一设备导入。</p></section></div></div></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x);const KEY='cozy-study-room-v1';const chars=[['bear','轻松小熊','安静陪读','今天也一起加油吧～'],['cream','小白熊','温柔鼓励','慢慢来，你已经做得很好啦。'],['chick','小黄鸡','专注监督','专注一小会，也很了不起！'],['honey','茶色小熊','完成奖励','学习结束，给你一勺蜂蜜！'],['wolf','灰蓝小狼','冲刺伙伴','再努力一会儿就能休息啦。'],['squirrel','粉色松鼠','治愈陪伴','先做好眼前这一件小事。'],['bird','薄荷小鸟','清单助手','今天的任务，我们一件件完成。'],['bee','小蜜蜂','打卡助手','每一分钟都在积累小收获。']];let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!state||typeof state!=='object')state={};state={...state,character:chars.some(c=>c[0]===state.character)?state.character:'bear',tasks:Array.isArray(state.tasks)?state.tasks:[],records:Array.isArray(state.records)?state.records:[]};state.tasks=state.tasks.filter(x=>x&&typeof x.text==='string').slice(-500);state.records=state.records.filter(x=>x&&Number.isFinite(+x.minutes)&&+x.minutes>0).slice(-5000);let mode='countdown',mins=25,running=false,paused=false,startedAt=0,elapsedBefore=0,interval=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{say('存储空间不足，请先导出备份。')}}function say(s){$('message').textContent=s}function day(d){const x=new Date(d);return Number.isFinite(x.getTime())?`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`:''}const today=()=>day(Date.now());function text(el,s){el.textContent=s}function selectChar(id){if(running)return say('专注进行中，结束后再切换伙伴吧。');state.character=id;save();renderChar()}function renderChar(){const c=chars.find(c=>c[0]===state.character)||chars[0];$('heroImage').src='assets/'+c[0]+'.webp';$('heroImage').alt=c[1];$('speech').textContent=c[3];$('characterGrid').innerHTML='';for(const x of chars){const b=document.createElement('button');b.type='button';b.className='char'+(c[0]===x[0]?' selected':'');b.setAttribute('aria-label','选择'+x[1]);b.innerHTML=`<img src="assets/${x[0]}.webp" alt=""><strong>${x[1]}</strong><small>${x[2]}</small>`;b.addEventListener('click',()=>selectChar(x[0]));$('characterGrid').append(b)}}function durationMs(){return mins*60000}function elapsed(){return elapsedBefore+(running&&!paused?Math.max(0,Date.now()-startedAt):0)}function clock(n){const v=Math.floor(Math.max(0,n)/1000);return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function renderTimer(){const e=elapsed();$('timer').textContent=clock(mode==='countdown'?Math.max(0,durationMs()-e):e);$('bar').style.width=mode==='countdown'?Math.min(100,e/durationMs()*100)+'%':'0%';$('sessionStatus').textContent=running?(paused?'已暂停':'正在专注'):'准备就绪';$('startBtn').textContent=running?(paused?'继续专注':'暂停'):'开始专注';$('finishBtn').hidden=!running;$('resetBtn').hidden=!running;$('durations').style.opacity=mode==='free'?.4:1;document.querySelectorAll('[data-min]').forEach(b=>{b.disabled=running||mode==='free';b.classList.toggle('active',Number(b.dataset.min)===mins)});$('countdownBtn').classList.toggle('active',mode==='countdown');$('freeBtn').classList.toggle('active',mode==='free');$('countdownBtn').disabled=running;$('freeBtn').disabled=running}function halt(){if(interval)clearInterval(interval);interval=null;running=false;paused=false;elapsedBefore=0;startedAt=0;renderTimer()}function complete(early=false){let ms=elapsed();if(mode==='countdown'&&!early)ms=durationMs();if(early&&ms<60000){if(!confirm('专注不足1分钟，不会计入记录。确定结束吗？'))return;halt();say('已经结束这次专注。');return}const completed=Math.max(1,Math.round(ms/60000));state.records.unshift({id:Date.now(),at:new Date().toISOString(),minutes:completed,character:state.character,mode});save();halt();renderStats();renderHistory();say('✿ 完成 '+completed+' 分钟！辛苦啦，喝点水吧～');$('speech').textContent='完成啦！好好休息一下 ♡'}function tick(){if(running&&!paused&&mode==='countdown'&&elapsed()>=durationMs()){complete(false);return}renderTimer()}$('startBtn').addEventListener('click',()=>{if(!running){running=true;paused=false;elapsedBefore=0;startedAt=Date.now();interval=setInterval(tick,500);say('');$('speech').textContent='我会安静地陪着你～'}else if(paused){paused=false;startedAt=Date.now()}else{elapsedBefore=elapsed();paused=true}renderTimer()});$('finishBtn').addEventListener('click',()=>{if(confirm('结束这次专注并保存已累计时间吗？'))complete(true)});$('resetBtn').addEventListener('click',()=>{if(confirm('放弃这次专注？不会记录时长。')){halt();say('已放弃本次专注')}});document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>{mins=Number(b.dataset.min);renderTimer()}));$('countdownBtn').addEventListener('click',()=>{mode='countdown';renderTimer()});$('freeBtn').addEventListener('click',()=>{mode='free';renderTimer()});function renderStats(){const valid=state.records;const sum=a=>a.reduce((n,r)=>n+Math.max(0,Number(r.minutes)||0),0);text($('todayMinutes'),String(sum(valid.filter(r=>day(r.at)===today()))));text($('totalMinutes'),String(sum(valid)));text($('sessionCount'),String(valid.length))}function renderTasks(){const list=$('taskList');list.innerHTML='';const t=state.tasks.filter(t=>t.day===today());text($('taskProgress'),t.filter(x=>x.done).length+' / '+t.length);if(!t.length){list.innerHTML='<div class="empty">今天还没有任务 ✿<br>写下第一件想完成的小事吧</div>';return}for(const task of t){const row=document.createElement('div');row.className='task'+(task.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!task.done;cb.setAttribute('aria-label','完成任务 '+task.text);cb.addEventListener('change',()=>{task.done=cb.checked;save();renderTasks()});const label=document.createElement('span');label.textContent=task.text;const del=document.createElement('button');del.type='button';del.textContent='×';del.title='删除任务';del.addEventListener('click',()=>{state.tasks=state.tasks.filter(x=>x.id!==task.id);save();renderTasks()});row.append(cb,label,del);list.append(row)}}$('taskForm').addEventListener('submit',e=>{e.preventDefault();const s=$('taskInput').value.trim();if(!s)return;state.tasks.push({id:Date.now()+Math.random(),day:today(),text:s,done:false});$('taskInput').value='';save();renderTasks()});function renderHistory(){const list=$('history');list.innerHTML='';if(!state.records.length){list.innerHTML='<div class="empty">还没有专注记录<br>每一次努力都会留在这里</div>';return}for(const r of state.records.slice(0,20)){const c=chars.find(x=>x[0]===r.character);const div=document.createElement('div');div.className='record';const left=document.createElement('span');left.textContent=(c?c[1]:'学习伙伴')+' · '+(r.mode==='free'?'自由计时':'倒计时');const right=document.createElement('span');right.innerHTML=`<strong>${Math.round(Number(r.minutes))} 分钟</strong> <small>${day(r.at)}</small>`;div.append(left,right);list.append(div)}}$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='轻松自习室备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text());const incoming=j.state;if(!incoming||!Array.isArray(incoming.records)||!Array.isArray(incoming.tasks))throw Error('无效备份');if(!confirm('导入会替换当前任务和专注记录，建议先导出当前备份。继续吗？'))return;state={character:chars.some(c=>c[0]===incoming.character)?incoming.character:'bear',tasks:incoming.tasks.filter(t=>t&&typeof t.text==='string').slice(-500),records:incoming.records.filter(r=>r&&Number.isFinite(+r.minutes)&&+r.minutes>0).slice(-5000)};save();renderChar();renderStats();renderTasks();renderHistory();say('备份导入成功')}catch{say('备份文件无效，导入失败。')}finally{e.target.value=''}});$('todayDate').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());renderChar();renderStats();renderTasks();renderHistory();renderTimer();document.addEventListener('visibilitychange',tick);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
