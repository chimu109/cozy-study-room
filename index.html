<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f1e6"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>轻松自习室 · 动物陪伴版</title>
<style>
:root{--ink:#55483d;--muted:#947e70;--cream:#fbf8f2;--line:#ede1d4;--pink:#f5d7d6;--green:#dcebd5;--gold:#fee4a6;--surface:#fffefa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 5% 0%,#fbe9e7,transparent 35%),radial-gradient(ellipse at 90% 45%,#e9f2e1,transparent 42%),#f8f2e9}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #98b99b;outline-offset:3px}.shell{max-width:1190px;margin:0 auto;padding:23px 20px 58px}.mast{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:19px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:51px;height:51px;background:#fff9e8;border:1px solid #ead6ae;border-radius:18px;font-size:28px}.brand h1{font-size:25px;line-height:1.2;margin:0;color:#615143;letter-spacing:1px}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.mast time{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(330px,.94fr);gap:18px}.panel{border:1px solid var(--line);background:rgba(255,254,250,.92);border-radius:25px;padding:23px;box-shadow:0 9px 34px #b5998320;min-width:0}.panel h2{font-size:17px;margin:0 0 13px}.lead{padding:0;overflow:hidden}.lead-head{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.tiny{font-size:12px;color:var(--muted)}.scene{position:relative;min-height:265px;margin:12px 19px 0;border-radius:24px 24px 17px 17px;background:radial-gradient(circle at 75% 18%,#ffffffb8 0 8%,transparent 35%),linear-gradient(180deg,#fff0e6,#f8eacb 73%,#e5edcf 73%);display:grid;place-items:center;overflow:hidden}.scene:before{content:"✿ · ✿   ♡   ✿";position:absolute;bottom:19px;left:18px;color:#b9c99c;letter-spacing:26px}.scene:after{content:"✦";position:absolute;top:22px;right:34px;color:#f6c6a6;font-size:30px}.star{position:absolute;font-size:25px;color:#eca7ac;opacity:.65;z-index:2}.star.a{top:29%;left:15%}.star.b{top:56%;right:12%;font-size:18px}.character{height:245px;width:min(260px,68%);object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 12px 8px #a78d7433);transition:opacity .15s ease;animation:breathe 3.2s ease-in-out infinite}.scene.focus .character{animation:study 1.7s ease-in-out infinite}.scene.pause .character{animation:nap 3.8s ease-in-out infinite}.scene.done .character{animation:celebrate .75s ease-in-out 3}.scene.done .star{animation:sparkle .6s ease-in-out infinite alternate}.speech{position:relative;z-index:3;max-width:84%;margin:-4px auto 16px;text-align:center;border:1px solid #ecd8d0;background:#fffdfa;border-radius:999px;padding:7px 18px;font-size:13px;color:#886d62}.companions{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;padding:16px 18px}.friend{min-width:0;border:1px solid #eeded0;border-radius:13px;background:#fffaf6;padding:5px 3px 6px;color:#806f65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.friend img{width:100%;max-height:57px;height:57px;object-fit:contain;transition:transform .2s}.friend.selected{background:#f0f5e9;border:2px solid #8fb696;color:#466d51}.friend:active img{transform:scale(1.12)}.timer-panel{margin-top:14px;text-align:center}.status{display:inline-flex;gap:7px;align-items:center;border-radius:30px;background:#f3eddf;padding:4px 13px;font-size:12px;color:#8e7860}.clock{font-size:clamp(47px,7vw,75px);font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1.32;font-weight:750;margin:7px 0}.progress{height:9px;border-radius:12px;background:#eee5d9;overflow:hidden;margin:0 0 17px}.bar{height:100%;width:0;background:linear-gradient(90deg,#99c59a,#d3d9a4);transition:width .35s}.modes,.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.chip,.action{border:1px solid #eadfd2;background:#fffdf9;color:#756352;border-radius:12px;min-height:39px;padding:8px 14px}.chip.active{background:#e9f2e1;border-color:#8db58e;color:#456a4a;font-weight:700}.action{padding:10px 20px;min-height:44px;font-weight:650}.action.primary{background:#91b998;border-color:#91b998;color:#fff}.action.warn{background:#fff4f0;color:#ae7f74}.actions{margin-top:15px}.note{font-size:11px;color:#9a8478;margin-top:10px}.aside{display:flex;flex-direction:column;gap:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border-radius:16px;background:#f8f4eb;padding:11px 5px;text-align:center}.stat strong{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:#6c8666}.stat span{font-size:11px;color:var(--muted)}.task-add{display:flex;gap:8px;margin:11px 0}.field{width:100%;min-width:0;border:1px solid #e8dacc;background:#fff;border-radius:13px;min-height:43px;padding:10px 12px;color:var(--ink);font-size:16px}.task-list{display:flex;flex-direction:column;gap:7px;max-height:240px;overflow:auto}.task{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:12px;background:#fbf7f1}.task label{flex:1;display:flex;align-items:center;gap:10px;min-width:0;word-break:break-word}.task input{width:19px;height:19px;accent-color:#83ab84;flex:none}.task.completed .tasktext{text-decoration:line-through;color:#afa59c}.smallbtn{border:0;background:none;color:#a58b80;font-size:19px;width:31px;height:34px}.sessionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.logs{max-height:290px;overflow:auto;display:flex;flex-direction:column;gap:8px}.log{display:flex;align-items:center;gap:10px;border-bottom:1px dashed #eee3d7;padding:7px 2px}.log img{width:35px;height:39px;object-fit:contain;flex:none}.logmain{flex:1;min-width:0}.logmain strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logmain small{font-size:11px;color:var(--muted)}.minutes{font-variant-numeric:tabular-nums;color:#739675;font-weight:700}.empty{padding:20px 8px;color:#a19185;text-align:center;font-size:13px}.backup{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.backup label{border:1px solid #e7ded2;border-radius:11px;padding:8px 13px;cursor:pointer;font-size:12px;background:#fff}.backup input{display:none}.toast{min-height:20px;color:#72916e;text-align:center;font-size:12px;margin-top:12px}.footer{margin-top:16px;text-align:center;color:#ae988a;font-size:11px}@keyframes breathe{0%,100%{transform:translateY(1px) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes study{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(4px) rotate(1deg)}}@keyframes nap{0%,100%{transform:translateY(2px) rotate(-4deg)}50%{transform:translateY(5px) rotate(-7deg)}}@keyframes celebrate{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-25px) rotate(7deg)}}@keyframes sparkle{to{transform:scale(1.5) rotate(14deg);opacity:1}}@media(max-width:830px){.layout{grid-template-columns:1fr}.shell{padding:15px 12px 36px}.mast{margin-bottom:13px}.scene{min-height:235px}.character{height:215px}.companions{grid-template-columns:repeat(8,minmax(0,1fr))}}@media(max-width:490px){.brand h1{font-size:20px}.mast time{font-size:11px}.panel{padding:17px;border-radius:19px}.lead-head{padding:17px 15px 0}.scene{margin:9px 11px 0;min-height:218px}.character{height:195px}.companions{grid-template-columns:repeat(4,1fr);padding:12px;gap:7px}.friend img{height:61px}.stats{gap:6px}.clock{font-size:57px}.chip{padding:8px 11px}}@media(prefers-reduced-motion:reduce){.character,.scene.done .star{animation:none!important}*{scroll-behavior:auto!important}}
</style></head><body><div class="shell">
<header class="mast"><div class="brand"><span class="logo">🧸</span><div><h1>轻松自习室 <span style="font-size:11px;color:#c09a86">V4</span></h1><p>Cozy Study Room · 今天也有人陪你认真努力</p></div></div><time id="today"></time></header>
<main class="layout"><section><div class="panel lead"><div class="lead-head"><div><h2 style="margin:0">♡ 今天和谁一起学习？</h2><div class="tiny" id="friendDesc">轻松小熊 · 慢慢来也很好</div></div><div class="tiny">8位小伙伴</div></div><div class="scene" id="scene"><span class="star a">✿</span><img class="character" id="hero" src="assets/bear-0.png" alt="当前陪伴伙伴"><span class="star b">♡</span></div><div class="speech" id="speech" aria-live="polite">今天也一起加油吧！</div><div class="companions" id="companions"></div></div>
<div class="panel timer-panel"><div class="status" id="status">✿ 还未开始 · 选个喜欢的时长吧</div><div class="clock" id="clock">25:00</div><div class="progress"><div class="bar" id="bar"></div></div><div class="modes" id="modes"><button class="chip" data-min="10">10分钟</button><button class="chip" data-min="15">15分钟</button><button class="chip active" data-min="25">25分钟</button><button class="chip" data-min="45">45分钟</button><button class="chip" data-min="60">60分钟</button><button class="chip" data-min="0">自由计时</button></div><div class="actions"><button id="start" class="action primary">▶ 开始专注</button><button id="pause" class="action" hidden>暂停</button><button id="finish" class="action" hidden>完成并记录</button><button id="cancel" class="action warn" hidden>放弃</button></div><div class="note">计时期间请保持设备唤醒；切换应用后会根据真实经过时间校正进度。</div><div id="toast" class="toast" aria-live="polite"></div></div></section>
<section class="aside"><div class="panel"><h2>☀ 今日学习进度</h2><div class="stats"><div class="stat"><strong id="todayMinutes">0</strong><span>今日专注分钟</span></div><div class="stat"><strong id="totalMinutes">0</strong><span>累计专注分钟</span></div><div class="stat"><strong id="sessionCount">0</strong><span>完成专注次数</span></div></div></div><div class="panel"><h2>✎ 今日待办清单</h2><form class="task-add" id="taskForm"><input id="taskText" class="field" placeholder="例如：阅读一篇论文" maxlength="100" required><button class="action primary" type="submit">添加</button></form><div class="task-list" id="tasks"></div></div><div class="panel"><div class="sessionhead"><h2>📚 专注日记</h2><span class="tiny">最近20条</span></div><div class="logs" id="logs"></div><div class="backup"><button class="chip" id="export">导出备份</button><label for="import">导入备份<input type="file" id="import" accept="application/json,.json"></label></div><p class="note">记录保存在本设备浏览器中；不同设备不会自动同步，请定期导出备份。</p></div></section></main>
<div class="footer">Made for slow and happy learning · 没有比较，也没有催促</div></div>
<script>
(()=>{'use strict';const KEY='cozy-study-room-v4', names=[['bear','轻松小熊','慢慢来也很好'],['cream','奶油小熊','温柔陪伴'],['chick','小黄鸟','认真监督'],['honey','茶色小熊','完成奖励'],['wolf','灰蓝小狼','冲刺搭档'],['squirrel','粉色松鼠','治愈鼓励'],['bird','薄荷小鸟','温暖提醒'],['bee','小蜜蜂','勤劳助手']];const $=s=>document.getElementById(s);let state={friend:0,mode:25,tasks:[],logs:[],timer:null};try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){state={...state,...saved};if(!Array.isArray(state.tasks))state.tasks=[];if(!Array.isArray(state.logs))state.logs=[];if(!Number.isInteger(state.friend)||state.friend<0||state.friend>=names.length)state.friend=0;if(![0,10,15,25,45,60].includes(state.mode))state.mode=25}}catch(e){}let ticker=null,celebrating=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){msg('本地存储不可用，请及时导出备份')}};const img=(id,action)=>'assets/'+names[id][0]+'-'+action+'.png';const dateKey=ms=>{let d=new Date(ms);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function msg(t){$('toast').textContent=t}function renderFriends(){let root=$('companions');root.replaceChildren();names.forEach((a,i)=>{let b=document.createElement('button');b.className='friend'+(state.friend===i?' selected':'');b.type='button';b.setAttribute('aria-label','选择'+a[1]);b.setAttribute('aria-pressed',state.friend===i?'true':'false');let im=document.createElement('img');im.src=img(i,0);im.alt='';im.loading='lazy';let txt=document.createElement('span');txt.textContent=a[1];b.append(im,txt);b.addEventListener('click',()=>{state.friend=i;save();renderFriends();renderHero();msg('今天由'+a[1]+'陪你学习 ♡')});root.append(b)})}function heroAction(){if(celebrating)return 2;if(state.timer?.running)return 1;return 0}function renderHero(){let a=names[state.friend];$('hero').src=img(state.friend,heroAction());$('hero').alt=a[1];$('friendDesc').textContent=a[1]+' · '+a[2];$('speech').textContent=celebrating?'好棒！又完成了一次专注 ✨':state.timer?.running?'我也在认真学习，我们一起加油！':state.timer?'累了就休息一下，我陪你。':'不必着急，慢慢开始吧 ♡';$('scene').className='scene'+(celebrating?' done':state.timer?(state.timer.running?' focus':' pause'):'')}function countElapsed(){if(!state.timer)return 0;const t=state.timer;return Math.max(0,Math.floor((t.elapsedMs+(t.running?Math.max(0,Date.now()-t.startedAt):0))/1000))}function timerUi(){let t=state.timer,elapsed=countElapsed(),remaining=t&&t.mode?Math.max(0,t.mode*60-elapsed):0;$('clock').textContent=t?(t.mode?fmt(remaining):fmt(elapsed)):state.mode?fmt(state.mode*60):'00:00';$('bar').style.width=t&&t.mode?Math.min(100,elapsed/(t.mode*60)*100)+'%':'0%';$('status').textContent=t?(t.running?'● 正在专注 · '+names[t.friend][1]+'陪你':'Ⅱ 已暂停 · 可以稍作休息'):'✿ 还未开始 · 选个喜欢的时长吧';$('start').hidden=!!t;$('pause').hidden=!t;$('finish').hidden=!t;$('cancel').hidden=!t;$('pause').textContent=t?.running?'暂停':'继续';document.querySelectorAll('#modes button').forEach(b=>{b.classList.toggle('active',Number(b.dataset.min)===state.mode);b.disabled=!!t});if(t&&t.mode&&elapsed>=t.mode*60)finish(true)}function renderTasks(){let root=$('tasks');root.replaceChildren();if(!state.tasks.length){root.innerHTML='<div class="empty">还没有任务，写下今天的小目标吧 ✿</div>';return}state.tasks.slice(0,120).forEach(item=>{let row=document.createElement('div');row.className='task'+(item.done?' completed':'');let label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=!!item.done;box.addEventListener('change',()=>{item.done=box.checked;save();renderTasks();if(item.done)msg('任务完成！你做得很好 ♡')});let span=document.createElement('span');span.className='tasktext';span.textContent=item.text;label.append(box,span);let remove=document.createElement('button');remove.type='button';remove.className='smallbtn';remove.textContent='×';remove.setAttribute('aria-label','删除任务');remove.addEventListener('click',()=>{state.tasks=state.tasks.filter(t=>t.id!==item.id);save();renderTasks()});row.append(label,remove);root.append(row)})}function renderLogs(){let root=$('logs');root.replaceChildren();if(!state.logs.length){root.innerHTML='<div class="empty">你的第一段学习时光，正等你开始 🌷</div>'}else state.logs.slice(0,20).forEach(l=>{let el=document.createElement('div');el.className='log';let image=document.createElement('img');image.src=img(Number.isInteger(l.friend)&&l.friend>=0&&l.friend<8?l.friend:0,0);image.alt='';let main=document.createElement('div');main.className='logmain';let strong=document.createElement('strong');strong.textContent=l.mode?'完成'+l.mode+'分钟专注':'自由专注';let small=document.createElement('small');small.textContent=new Date(l.at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' · '+names[l.friend]?.[1];main.append(strong,small);let min=document.createElement('span');min.className='minutes';min.textContent=l.minutes+'分钟';el.append(image,main,min);root.append(el)});let today=dateKey(Date.now()),m=0,total=0;for(let x of state.logs){let n=Number(x.minutes)||0;total+=n;if(dateKey(x.at)===today)m+=n}$('todayMinutes').textContent=m;$('totalMinutes').textContent=total;$('sessionCount').textContent=state.logs.length}function finish(auto=false){let t=state.timer;if(!t)return;const seconds=countElapsed(),mins=Math.round(seconds/60);if(seconds<60&&!auto){msg('至少专注1分钟才能记入日记');return}state.logs.unshift({id:Date.now(),at:Date.now(),mode:t.mode,minutes:t.mode&&auto?t.mode:Math.max(1,mins),friend:t.friend});state.logs=state.logs.slice(0,1000);state.timer=null;celebrating=true;clearInterval(ticker);ticker=null;save();renderLogs();timerUi();renderHero();msg('专注完成！小伙伴为你庆祝啦 🎉');window.setTimeout(()=>{celebrating=false;renderHero()},3500)}function start(){if(state.timer)return;state.timer={mode:state.mode,friend:state.friend,startedAt:Date.now(),elapsedMs:0,running:true};save();renderHero();timerUi();ticker=setInterval(()=>{timerUi();save()},1000);msg('开始啦，专心学习 ✎')}function pause(){let t=state.timer;if(!t)return;if(t.running){t.elapsedMs+=Math.max(0,Date.now()-t.startedAt);t.running=false}else{t.startedAt=Date.now();t.running=true}save();renderHero();timerUi()}function cancel(){if(!state.timer)return;if(!confirm('放弃这次专注吗？本次时间不会记入日记。'))return;state.timer=null;clearInterval(ticker);ticker=null;save();renderHero();timerUi();msg('没关系，随时可以重新开始。')}document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{if(state.timer)return;state.mode=Number(b.dataset.min);save();timerUi()}));$('start').addEventListener('click',start);$('pause').addEventListener('click',pause);$('finish').addEventListener('click',()=>finish(false));$('cancel').addEventListener('click',cancel);$('taskForm').addEventListener('submit',e=>{e.preventDefault();let v=$('taskText').value.trim();if(!v)return;state.tasks.unshift({id:Date.now()+Math.random(),text:v,done:false});$('taskText').value='';save();renderTasks()});$('export').addEventListener('click',()=>{let blob=new Blob([JSON.stringify({app:'cozy-study-room',version:4,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='轻松自习室备份-'+dateKey(Date.now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('import').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let raw=JSON.parse(await f.text());let val=raw.data||raw;if(!Array.isArray(val.tasks)||!Array.isArray(val.logs))throw Error('格式不匹配');if(!confirm('导入会替换当前任务和历史记录。请先导出当前数据。是否继续？'))return;state.tasks=val.tasks.slice(0,500).map(t=>({id:t.id??Math.random(),text:String(t.text||'未命名任务').slice(0,100),done:!!t.done}));state.logs=val.logs.slice(0,1000).filter(x=>x&&Number.isFinite(x.at)&&Number.isFinite(x.minutes)).map(x=>({id:x.id||x.at,at:x.at,minutes:Math.max(1,Math.min(10000,Math.round(x.minutes))),mode:Number(x.mode)||0,friend:Number.isInteger(x.friend)&&x.friend>=0&&x.friend<8?x.friend:0}));state.timer=null;clearInterval(ticker);ticker=null;save();renderTasks();renderLogs();timerUi();renderHero();msg('导入成功')}catch(err){msg('导入失败：请使用本网站导出的JSON文件')}finally{e.target.value=''}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){timerUi();renderHero()}});$('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});renderFriends();renderTasks();renderLogs();renderHero();timerUi();if(state.timer){if(!Number.isFinite(state.timer.startedAt)||!Number.isFinite(state.timer.elapsedMs)||![0,10,15,25,45,60].includes(state.timer.mode)){state.timer=null;save();timerUi()}else if(state.timer.running)ticker=setInterval(()=>{timerUi();save()},1000)}window.addEventListener('pagehide',save)})();
</script><script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
